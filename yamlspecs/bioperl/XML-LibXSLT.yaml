!include common.yaml
---
- package: XML-LibXSLT Perl module 
  name: XML-LibXSLT
  version: "{{versions.XML_LibXSLT}}"
  loc: "{{versions.XML_LibXSLT_loc}}"
  vendor_source: https://cpan.metacpan.org/authors/id/{{loc}}/{{name}}-{{version}}.{{extension}}
  description: >
    XML-LibXSLT perl module. Interface to GNOME libxslt library

  opts10: !OScmp ">=,10,1,0"
  build:
    configure: >
      export PERL_MM_USE_DEFAULT=true;
      if [ {{opts10}} == 1 ]; then \
          sed -i '169s/exit 0; //' Makefile.PL; \
          export PERL_MM_OPT="OPTIMIZE='-O2 -Wno-error=incompatible-pointer-types -Wno-error=implicit-int -Wno-error=implicit-function-declaration'"; \
          perl Makefile.PL; \
      fi;
